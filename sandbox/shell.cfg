name: "wenzhou-read"
mode: ONCE
hostname: "wenzhou"
cwd: "/game"
time_limit: 10
log_level: ERROR
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
envar: "JAVA_TOOL_OPTIONS=-Xmx144m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=32m -Xss512k"
keep_caps: false
iface_no_lo: true
rlimit_as: 3072
rlimit_cpu: 8
rlimit_fsize: 32
rlimit_nofile: 96
rlimit_nproc: 32
rlimit_nproc_type: VALUE
rlimit_core: 0
uidmap { inside_id: "65534" }
gidmap { inside_id: "65534" }
mount { src: "/opt/wenzhouai/rootfs" dst: "/" is_bind: true rw: false nosuid: true nodev: true }
mount { src: "/opt/wenzhouai/game" dst: "/game" is_bind: true rw: false nosuid: true nodev: true noexec: true }
mount { dst: "/tmp" fstype: "tmpfs" options: "size=48m,mode=1777" rw: true nosuid: true nodev: true noexec: true }
mount { dst: "/proc" fstype: "proc" rw: false nosuid: true nodev: true noexec: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }
seccomp_string: "ERRNO(1) { mount, umount, pivot_root, setns, unshare, ptrace, process_vm_writev, bpf, perf_event_open, keyctl, add_key, request_key, userfaultfd } DEFAULT ALLOW"
